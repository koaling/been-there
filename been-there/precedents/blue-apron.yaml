name: Blue Apron
slug: blue-apron
type: failure
years: 2012-2023
region: US
sector: meal-kits
business_model: b2c-subscription-delivery
funding: "IPO 2017 at ~$1.9B valuation"
causes: [retention, unit-economics]
root_cause: >
  Pioneered meal kits by subscription, but many subscribers cancelled after
  trying it, so growth depended on constantly buying new customers. Cold-chain
  logistics for individually packed portions kept costs high. It was sold to
  Wonder in 2023 for about $103M, roughly 95% below its IPO valuation.
warning_signs:
  - High churn after the first boxes.
  - Revenue falling while acquisition spend stayed high.
survived_by: []
lesson: A subscription only works if people stay; measure churn after the trial before paying to acquire more.

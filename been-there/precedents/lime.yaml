region: US / EU
sector: micromobility
business_model: shared-vehicle-rental
funding: "VC (incl. Uber investment, 2020)"
causes: [unit-economics, overengineering]
root_cause: >
  Same market as Bird, but it designed its own durable, modular scooters and
  bikes, stretching vehicle life from a few months in 2018 to years. Lower
  maintenance capex made it the first micromobility company with a full
  profitable year (2022, adjusted EBITDA).
warning_signs: []
survived_by: []
lesson: Durable hardware turned scooter economics around; cheaper vehicles were the trap, not the saving.

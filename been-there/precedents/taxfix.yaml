name: Taxfix
slug: taxfix
type: survivor
years: 2016-present
region: EU (Germany, Spain, UK)
sector: consumer-tax-filing
business_model: b2c-pay-per-filing
funding: "VC; $220M round at ~$1B+ valuation (2022)"
causes: [distribution, regulation]
root_cause: >
  A mobile app that files income tax returns through a chat-like interface,
  charging only when there is a refund. It targeted people who weren't filing
  at all rather than switching existing filers, used Germany's official tax
  API, and expanded to Spain (2022) and the UK.
warning_signs: []
survived_by: []
lesson: Pick users who aren't served at all, and plug into the official system rather than fighting it.

name: Chewy
slug: chewy
type: survivor
years: 2011-present
region: US
sector: e-commerce-pet-supplies
business_model: b2c-e-commerce-subscription
funding: "Bootstrapped start, then VC; acquired by PetSmart (2017), IPO 2019"
causes: [unit-economics, retention]
root_cause: >
  Same category that killed Pets.com, but Chewy turned heavy, repeat purchases
  into scheduled Autoship deliveries (later ~73% of sales) and competed on
  service rather than ad spend. Predictable repeat orders made the shipping
  costs work; it passed $11B revenue and turned profitable.
warning_signs: []
survived_by: []
lesson: The fix for low-margin heavy goods was recurring orders and loyalty, not a bigger marketing budget.

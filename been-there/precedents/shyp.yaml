name: Shyp
slug: shyp
type: failure
years: 2013-2018
region: US
sector: on-demand-shipping
business_model: b2c-on-demand-service
funding: "~$62M"
causes: [unit-economics, premature-scaling]
root_cause: >
  Couriers picked up, packed and shipped items on demand for a low fee,
  which was labour-heavy per order. It expanded to several cities chasing
  consumers before the economics worked; its CEO later said he should have
  built profitability in from the start and served business customers sooner.
warning_signs:
  - Fast consumer growth without positive margin per pickup.
  - Missing expansion targets and retreating to one city (2017).
survived_by: []
lesson: Loved by customers is not the same as profitable per order; prove contribution margin before city two.

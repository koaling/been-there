name: Katerra
slug: katerra
type: failure
years: 2015-2021
region: US
sector: construction-tech
business_model: vertically-integrated-construction
funding: "~$2B (mostly SoftBank Vision Fund)"
causes: [premature-scaling, overengineering]
root_cause: >
  Tried to own the whole chain at once (design, factories, materials, general
  contracting, project management), acquiring more than twenty companies,
  while its projects repeatedly ran into problems. Financing dependent on
  Greensill collapsed in 2021 and it filed for Chapter 11.
warning_signs:
  - Projects stumbling while the company kept expanding scope and offices.
  - Dependence on a single financier for bonding and working capital.
survived_by: []
lesson: Integrating every step multiplies hard problems; make one piece work profitably before owning the next.

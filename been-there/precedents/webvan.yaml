name: Webvan
slug: webvan
type: failure
years: 1996-2001
region: US
sector: grocery-delivery
business_model: b2c-delivery-own-infrastructure
funding: "Raised and lost over $800M (VC + 1999 IPO)"
causes: [premature-scaling, unit-economics]
root_cause: >
  Signed a ~$1B contract to build automated warehouses (~$30-35M each) for a
  26-city plan and expanded to new cities while the first market (San Francisco)
  was still unprofitable. Warehouses were sized for far more orders than it got,
  and delivery density per route never became high enough.
warning_signs:
  - Expanding to Atlanta and other cities while San Francisco was still "wobbly".
  - Warehouses built for capacity well above actual daily orders.
  - Acquired HomeGrocer, another loss-making grocery delivery company, in 2000.
survived_by: [instacart]
lesson: Prove delivery density and per-order economics in one market before building infrastructure for many.

name: Netflix (move to streaming)
slug: netflix-streaming
type: survivor
years: 2007-2013
region: US
sector: media-subscription
business_model: b2c-subscription
funding: "Public company"
causes: [pricing, timing, retention]
root_cause: >
  Launched streaming in 2007 next to its DVD business. In 2011 it split the
  plans (effectively a ~60% price rise) and announced Qwikster; it lost about
  800,000 subscribers and most of its stock value, dropped Qwikster within
  weeks but kept the new pricing and committed to streaming.
warning_signs: []
survived_by: []
lesson: Cannibalizing your own business can be right, but a sudden price rise plus a confusing split nearly broke it; change one thing at a time.

name: Instacart
slug: instacart
type: survivor
years: 2012-
region: US
sector: grocery-delivery
business_model: marketplace-asset-light
causes: [premature-scaling, unit-economics]
root_cause: >
  Faced the same grocery-delivery economics that sank Webvan, but owned no
  warehouses, trucks or inventory: shoppers picked orders from existing
  supermarkets and delivered them in their own vehicles. Entering a new city
  meant digitising local stores' inventory and recruiting shoppers, not building
  infrastructure, and retailers became paying partners.
warning_signs:
  - Still had to fight thin grocery margins (fees and shopper pay were cut at times).
survived_by: []
lesson: Use existing infrastructure as your "warehouse" until demand forces you to own it.

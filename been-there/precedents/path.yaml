name: Path
slug: path
type: failure
years: 2010-2018
region: US
sector: consumer-social
business_model: ad-free-social-app
funding: "VC; once valued at ~$500M"
causes: [competition, distribution]
root_cause: >
  A private, mobile-first social network that limited each user to 50 friends
  as an intimate alternative to Facebook. The cap held back the network effect,
  the limit was raised to 150 and then 500, and the service shut down in
  October 2018 after years of decline outside a few markets.
warning_signs:
  - The core differentiator also limits growth.
  - Usage concentrated in one or two countries.
survived_by: []
lesson: A social product lives or dies on network effects; a feature that slows invites needs a strong reason people will pay or stay.

name: Dunkin' (dropped "Donuts")
slug: dunkin
type: survivor
years: 2018-2019
region: US
sector: food-and-beverage
business_model: franchise-retail
funding: "Public company"
causes: [distribution]
root_cause: >
  Dropped "Donuts" because ~60% of sales were already drinks and customers
  already said "Dunkin'". It tested the name in ~50 stores for a year, kept its
  pink and orange colours and font, and posted its best quarterly sales growth
  in four years after the change.
warning_signs: []
survived_by: []
lesson: Rename toward what customers already call you, test it in a few locations first, and keep the visual cues they recognise.

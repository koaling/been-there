name: Google Glass (Explorer Edition)
slug: google-glass
type: failure
years: 2013-2015
region: US
sector: smart-glasses-consumer
business_model: consumer-hardware
funding: "Google"
causes: [trust-privacy, pricing, no-market-need]
root_cause: >
  Sold a $1,500 beta to early adopters while a consumer launch kept slipping.
  Privacy concerns about the camera led some bars and restaurants to ban it,
  and wearers were mocked as "Glassholes". Google ended consumer sales of the
  Explorer Edition in January 2015 and refocused on business uses.
warning_signs:
  - People around the user, not just the user, objecting to the product.
  - A high price for an unfinished product with unclear everyday use.
survived_by: []
lesson: For wearables in public, other people's comfort is part of the product; test social acceptance, not just the tech.

name: Juicero
slug: juicero
type: failure
years: 2013-2017
region: US
sector: consumer-hardware
business_model: hardware-plus-consumables
funding: "~$120M (Google Ventures, Kleiner Perkins, Campbell Soup, others)"
causes: [overengineering, no-market-need, pricing]
root_cause: >
  An internet-connected juice press (launched in 2016 at $699, cut to $400) that
  only worked with its own $5-8 produce packs. In April 2017 Bloomberg showed the
  packs could be squeezed by hand with nearly the same result, so the expensive
  hardware added little over the consumable. It shut down in September 2017.
warning_signs:
  - Price cut from $699 to $400 within months, with plans to go lower.
  - Founder replaced as CEO before the Bloomberg story.
  - The value lived in the consumable, not in the machine.
survived_by: []
lesson: If customers can get the result without your hardware, the hardware is a cost, not a product.

name: Homejoy
slug: homejoy
type: failure
years: 2012-2015
region: US
sector: on-demand-home-services
business_model: marketplace-labor
funding: "~$40M"
causes: [retention, labor-model, unit-economics]
root_cause: >
  Grew with deep first-cleaning discounts, but most customers never booked
  again and the best cleaners left to work for clients directly. Losses
  mounted with a costly international expansion, and worker-classification
  lawsuits scared off the next funding round.
warning_signs:
  - Most discounted customers never returned.
  - Top cleaners setting up direct arrangements with clients (disintermediation).
survived_by: []
lesson: Discount-driven growth only works if customers and workers stay; measure repeat rate before buying more first orders.

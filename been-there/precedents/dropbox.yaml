root_cause: >
  Investors said file sync was crowded and unimportant. Before the product was
  finished, Drew Houston posted a demo video aimed at Hacker News and Digg;
  the beta waitlist went from 5,000 to 75,000 overnight. A two-sided referral
  program then drove growth.

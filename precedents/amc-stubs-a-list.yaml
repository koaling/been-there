name: AMC Stubs A-List
slug: amc-stubs-a-list
type: survivor
years: 2018-
region: US
sector: entertainment-subscription
business_model: b2c-subscription
causes: [pricing, unit-economics]
root_cause: >
  Launched in June 2018 as a rival to MoviePass at about twice the price
  ($19.95/month) with a cap of three films per week. Because AMC owns the
  cinemas, it was "essentially paying itself" for tickets, kept the concession
  revenue, and priced the plan from its own data on how often subscribers go.
warning_signs:
  - AMC estimated subscribers needed to average about 2.5-3 visits a month for the plan to stay profitable, so usage had to be monitored.
survived_by: []
lesson: Subscriptions work when you control the cost of what you resell, cap usage, and price from real usage data.

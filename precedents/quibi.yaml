name: Quibi
slug: quibi
type: failure
years: 2018-2020
region: US
sector: streaming-media
business_model: b2c-subscription
funding: "$1.75B raised (about $350M reportedly returned to investors)"
causes: [no-market-need, competition, timing]
root_cause: >
  Paid premium short-form video (episodes under 10 minutes) designed for phones
  and on-the-go moments, launched in April 2020 when people were at home
  watching TV, without TV casting at launch, in a crowded streaming market and
  against free short video. Its founders' own shutdown letter named two
  possible causes: the idea wasn't strong enough to justify a standalone
  service, or the timing. It announced its shutdown about six months after launch.
warning_signs:
  - Core usage moment (commuting, waiting in line) never validated with paying users.
  - Low conversion from the 90-day free trial to paid subscriptions.
survived_by: []
lesson: Money can't buy a habit; test willingness to pay against the free alternative before funding the content.

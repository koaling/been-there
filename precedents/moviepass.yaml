name: MoviePass
slug: moviepass
type: failure
years: 2011-2019
region: US
sector: entertainment-subscription
business_model: b2c-subscription
funding: "Majority-owned by Helios and Matheson Analytics from 2017 (parent filed Chapter 7 in 2020)"
causes: [pricing, unit-economics]
root_cause: >
  In August 2017 it cut the price to $9.95/month for one film per day while
  paying cinemas the full ticket price, so it lost money as soon as a
  subscriber went twice a month. The most frequent moviegoers signed up first,
  and theatre chains refused to share concession revenue.
warning_signs:
  - Losses rose with every new subscriber; the parent said monthly losses would grow as the service became more popular.
  - Repeated emergency changes in 2018 (price rise to $14.95, blackouts of new releases, then 3 films a month).
survived_by: [amc-stubs-a-list]
lesson: A price that only works if customers don't use the product is not a business model.
sources:

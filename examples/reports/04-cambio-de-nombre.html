  :root{

    --test:light-dark(#8A5A00,#FFC861);--test-soft:light-dark(#FFF4DC,#3A2E12);

  *{box-sizing:border-box;min-width:0}
  html{-webkit-text-size-adjust:100%;scroll-padding-top:72px;overflow-x:clip}

  main{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
  h1,h2,h3,.display{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",sans-serif}
  a{color:var(--violet)}

  .skip{position:absolute;left:-999px;top:8px}.skip:focus{left:16px;background:var(--card);padding:8px 12px;z-index:9}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

  /* header */
  .brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
  .brand .dot{width:10px;height:10px;border-radius:50%;background:#E2475A;box-shadow:0 0 0 4px light-dark(#FDE8EB,#3A1C24)}
  .brand a{color:inherit;text-decoration:none}
  .brand time{margin-left:auto;font-weight:600;color:var(--muted);font-size:14px}
  h1{font-size:clamp(26px,4.4vw,40px);line-height:1.12;margin:10px 0 0;letter-spacing:-.02em;text-wrap:balance}
  .meta{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-top:12px;font-size:14px;color:var(--muted)}
  .meta b{color:var(--ink);font-weight:700}
  .stamp{display:inline-flex;font-size:13px;font-weight:800;border-radius:8px;padding:3px 10px;border:2px solid currentColor;transform:rotate(-2deg)}
  .stamp.draft{color:var(--muted)}.stamp.decided{color:var(--go)}.stamp.dropped{color:var(--stop)}

  /* section nav */
  .toc{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;margin:2px -2px 0}
  .toc::-webkit-scrollbar{display:none}
  .toc a{flex:none;font-size:14px;font-weight:700;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-height:40px;display:inline-flex;align-items:center}
  .toc a:hover{border-color:var(--violet);color:var(--violet)}
  @media(min-width:900px){.toc{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:10px 2px}}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--shadow)}
  h2{font-size:21px;line-height:1.2;margin:0 0 6px;display:flex;align-items:center;gap:10px;letter-spacing:-.01em;flex-wrap:wrap}
  h2 .count{font-size:13px;font-weight:800;color:var(--violet);background:var(--violet-soft);border-radius:999px;padding:2px 10px}
  .hint{margin:0 0 16px;color:var(--muted);font-size:14.5px}

  /* verdict */
  .hero{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 220px at 100% 0,var(--tone-soft),transparent 70%);pointer-events:none}
  .hero > *{position:relative;z-index:1}
  .hero .who{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);text-align:center}
  .label{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:800;color:var(--tone);background:var(--tone-soft);border-radius:999px;padding:4px 12px}
  .verdict{font-size:clamp(22px,3.4vw,30px);font-weight:800;line-height:1.22;margin:10px 0 0;letter-spacing:-.015em;text-wrap:balance;display:block}
  .ring{display:flex;flex-direction:column;align-items:center;width:124px}
  .ring .dial{position:relative;width:112px;height:112px}
  .ring .dial b{position:absolute;inset:0;display:grid;place-items:center;font-size:32px;font-weight:800;font-family:ui-rounded,"SF Pro Rounded",sans-serif;line-height:1;text-align:center}
  .ring .dial b small{display:block;font-size:13px;color:var(--muted);font-weight:700}
  .ring .cap{font-size:12.5px;font-weight:700;color:var(--muted);text-align:center;line-height:1.3;margin-top:6px}
  .tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
  .btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font-family:inherit;font-size:14.5px;font-weight:700;line-height:1;cursor:pointer}
  .btn:hover{border-color:var(--violet);color:var(--violet)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;z-index:10}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:680px){.hero{grid-template-columns:minmax(0,1fr)}.hero .who{flex-direction:row;gap:10px;justify-content:center}.hero .who .mascot{width:64px;height:64px}.ring{margin:0 auto}.hero .body{text-align:center}.tools{justify-content:center}}

  /* actions */
  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
  @media(max-width:760px){.actions{grid-template-columns:minmax(0,1fr)}}
  .a{border-radius:18px;padding:16px 18px}
  .a .k{font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px;margin:0 0 6px}
  .a.test{background:var(--violet-soft)} .a.test .k{color:var(--violet)}
  .a.next{background:var(--go-soft)} .a.next .k{color:var(--go)}
  .a.kill{background:var(--stop-soft)} .a.kill .k{color:var(--stop)}

  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
  @media(max-width:680px){.grid2{grid-template-columns:minmax(0,1fr)}}
  .note{display:flex;gap:14px;align-items:flex-start}
  .note .ic{flex:none;width:40px;height:40px;border-radius:14px;display:grid;place-items:center}
  .note h3{margin:0 0 4px;font-size:16px}

  /* context */
  .ask{margin:0;font-size:16.5px;padding-left:16px;border-left:4px solid var(--violet)}
  .ask.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .more{background:none;border:0;color:var(--violet);font-family:inherit;font-size:14.5px;font-weight:700;padding:8px 0;min-height:44px;cursor:pointer}
  .facts{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
  .facts li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;align-items:baseline}
  @media(max-width:420px){.facts li{grid-template-columns:minmax(0,1fr);gap:2px}}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;border-radius:999px;padding:2px 10px;white-space:nowrap;justify-self:start}
  .pill .ico{width:14px;height:14px;stroke-width:3}
  .pill.given,.pill.for,.pill.surv{background:var(--go-soft);color:var(--go)}
  .pill.assumed,.pill.depends{background:var(--test-soft);color:var(--test)}
  .pill.external{background:var(--violet-soft);color:var(--violet)}
  .pill.against,.pill.fell{background:var(--stop-soft);color:var(--stop)}

  /* precedents */
  .prec{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
  .p{border-radius:18px;padding:16px;border:1.5px solid var(--line);background:var(--card-2)}
  .p.failure{border-color:light-dark(#F5CBD2,#5A2A35)} .p.survivor{border-color:light-dark(#BFE9D3,#24533F)}
  .p h3{margin:10px 0 0;font-size:18px;line-height:1.25} .p .yrs{font-size:14px;color:var(--muted);font-weight:600}
  .p p{margin:8px 0 10px;font-size:15px}
  .p .sim{font-size:13px;color:var(--muted);font-weight:700;margin:0 0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px}
  .chips > span{font-size:13px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--violet-soft);color:var(--violet)}
  .chips > .miss{background:light-dark(#F2F0F6,#2A2537);color:var(--muted);text-decoration:line-through}
  .src{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:700;text-decoration:none;margin-top:10px;min-height:32px}
  .src .ico{width:16px;height:16px}
  .src:hover{text-decoration:underline}

  /* crew */
  .tally{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line);margin:4px 0 8px;gap:2px}
  .tally i{display:block;height:100%}
  .legend{display:flex;gap:6px 16px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:16px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .legend b{width:10px;height:10px;border-radius:50%;display:inline-block}
  .crew{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:12px}
  .m{display:grid;grid-template-columns:86px minmax(0,1fr);gap:12px;align-items:start;border-radius:20px;padding:14px;background:var(--mc-soft);border:1.5px solid var(--mc-line)}
  .m .av{display:flex;flex-direction:column;align-items:center}
  .m .nick{font-weight:800;font-size:15px;font-family:ui-rounded,"SF Pro Rounded",sans-serif}
  .m .head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px}
  .m .role{font-family:ui-rounded,"SF Pro Rounded","Nunito",sans-serif;font-size:17px;font-weight:800;color:var(--mc-ink);line-height:1.2;margin:0}
  .m .persona{font-size:13.5px;color:var(--muted);margin:2px 0 8px}
  .bubble{background:var(--card);border-radius:16px;padding:10px 12px;font-size:15px;box-shadow:0 2px 8px -4px rgba(35,28,58,.25);margin:0}
  .bubble .op{display:inline-block;font-size:12.5px;font-weight:700;color:var(--muted);background:light-dark(#F2F0F6,#2A2537);border-radius:999px;padding:0 8px;margin-left:4px}
  @media(max-width:420px){.m{grid-template-columns:64px minmax(0,1fr)}.m .mascot{width:64px;height:64px}}
  :root[data-theme=dark] .m{--mc-ink:var(--ink)!important}
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]) .m{--mc-ink:var(--ink)!important}}

  /* premortem */
  .pm{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
  .pm li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start}
  .pm .n{width:34px;height:34px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:800}
  .pm .sig{display:inline-block;margin-top:4px;font-size:14px;color:var(--muted)}
  .pm .sig b{color:var(--ink)}

  .srcs{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:15px}
  .srcs a{overflow-wrap:anywhere}
  details.how summary{cursor:pointer;font-weight:800;font-size:18px;list-style:none;display:flex;align-items:center;gap:10px;min-height:44px;font-family:ui-rounded,"SF Pro Rounded","Nunito",sans-serif}
  details.how summary::-webkit-details-marker{display:none}
  details.how summary::after{content:"+";margin-left:auto;font-size:24px;color:var(--violet)}
  details.how[open] summary::after{content:"–"}
  .how-body{margin-top:12px;font-size:15px;display:flex;flex-direction:column;gap:12px}
  .how-body p{margin:0}
  .crewkey{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
  .crewkey div{display:flex;align-items:center;gap:8px;font-size:14px}
  footer{text-align:center;color:var(--muted);font-size:14px;margin-top:8px;display:flex;flex-direction:column;gap:4px;align-items:center}
  footer a{font-weight:700}

  /* motion */
  @media (prefers-reduced-motion:no-preference){
    .js .reveal{opacity:0;transform:translateY(16px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}
    .js .reveal.in{opacity:1;transform:none}
    .ring .arc{transition:stroke-dasharray 1.3s cubic-bezier(.2,.8,.2,1) .25s}
    .tally i{transition:width 1s cubic-bezier(.2,.8,.2,1) .2s}
    .m{transition:transform .25s ease}
    .m:hover{transform:translateY(-2px)}
  }
  @media print{
    body{background:#fff;color:#000;padding:0}body::before,.toc,.tools,.toast,.skip{display:none!important}
    .card{box-shadow:none;break-inside:avoid}.reveal{opacity:1!important;transform:none!important}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    a[href^="http"]::after{content:" (" attr(href) ")";font-size:11px;color:#555;overflow-wrap:anywhere}
  }
</style>
</head>

.mascot{overflow:visible}
.mascot .bob,.mascot .sh,.mascot .eyes{transform-box:fill-box;transform-origin:50% 100%}

}`;
(function(){ if (typeof document==='undefined' || document.getElementById('bt-mascot-css')) return;

    check:'<path d="M20 6 9 17l-5-5"/>', zap:'<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
    target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', stop:'<path d="M8 2h8l6 6v8l-6 6H8l-6-6V8z"/><path d="M15 9l-6 6M9 9l6 6"/>',
    copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>', ext:'<path d="M14 4h6v6M20 4 10 14M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6"/>',
    flask:'<path d="M9 3h6M10 3v6L4 19a1 1 0 0 0 .9 1.5h14.2A1 1 0 0 0 20 19l-6-10V3"/>', x:'<path d="M18 6 6 18M6 6l12 12"/>',
    rocket:'<path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2c.7-.8.7-2 0-2.8a2 2 0 0 0-3 0z"/><path d="M12 15 9 12a22 22 0 0 1 2-4 13 13 0 0 1 11-6c0 2.7-.8 7.5-6 11a22 22 0 0 1-4 2z"/>'
  };
  const ico = k => `<svg class="ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${I[k]}</svg>`;
  const tones = {go:['var(--go)','var(--go-soft)','var(--ring-go)','rocket'],stop:['var(--stop)','var(--stop-soft)','var(--ring-stop)','x'],test:['var(--test)','var(--test-soft)','var(--ring-test)','flask']};
  const tk = tones[d.tone] ? d.tone : 'test', tone = tones[tk];
  const conf = Math.max(0,Math.min(10,Math.round(+d.confidence||0))), C = 2*Math.PI*48;
  const fmtDate = s => { const x = new Date(String(s)+'T12:00:00'); return isNaN(x) ? esc(s) : esc(x.toLocaleDateString(lang,{day:'numeric',month:'short',year:'numeric'})); };
  const mq = (k,sz) => mascot(k,sz).replace(/ role="img" aria-label="[^"]*"/,' aria-hidden="true" focusable="false"');
  const adv = (d.advisors||[]).map(a => ({...a, key:(a.role && CREW[a.role]) ? a.role : crewKey(a.name)}));
  const cnt = {for:0,depends:0,against:0}; adv.forEach(a => { if (a.position in cnt) cnt[a.position]++; });
  const tot = adv.length || 1, cx = d.context || {}, st = d.status ? (t.status[d.status] || d.status) : '';
  const posVar = k => k==='for'?'var(--ring-go)':k==='against'?'var(--ring-stop)':'var(--ring-test)';
  const pm = (d.premortem||[]).map(x => typeof x === 'string' ? {cause:x} : x);
  const prec = d.precedents||[], facts = d.facts||[], srcs = d.sources||[];
  const sections = [['verdict',1],['todo',1],['ctx',cx.prompt||facts.length],['prec',1],['crew',adv.length],['pm',pm.length],['src',srcs.length]].filter(s=>s[1]);
  document.documentElement.lang = lang;
  document.title = 'Been There · ' + d.title;
  document.querySelector('.skip').textContent = t.skip;

  document.getElementById('app').innerHTML = `
    <header>
      <div class="brand"><span class="dot" aria-hidden="true"></span><a href="https://koaling.github.io/been-there/">Been There</a>${d.date?`<time datetime="${esc(d.date)}">${fmtDate(d.date)}</time>`:''}</div>
      <h1>${esc(d.title)}</h1>
      ${(st||cx.prepared_by||cx.for||d.review_date)?`<div class="meta">${st?`<span class="stamp ${esc(d.status)}">${esc(st)}</span>`:''}${cx.prepared_by?`<span>${esc(t.by)}: <b>${esc(cx.prepared_by)}</b></span>`:''}${cx.for?`<span>${esc(t.forr)}: <b>${esc(cx.for)}</b></span>`:''}${d.review_date?`<span>${esc(t.review)}: <b><time datetime="${esc(d.review_date)}">${fmtDate(d.review_date)}</time></b></span>`:''}</div>`:''}
    </header>
    <nav class="toc" aria-label="${esc(t.navLabel)}">${sections.map(s=>`<a href="#${s[0]}">${esc(t.nav[s[0]])}</a>`).join('')}</nav>

    <section class="card hero" id="verdict" aria-labelledby="v-h" style="--tone:${tone[0]};--tone-soft:${tone[1]}">
      <div class="who hop">${mq('chair',96)}<span>Vera · ${esc(t.chairs)}</span></div>
      <div class="body">
        <span class="label">${ico(tone[3])}${esc(t.tone[tk])}</span>
        <h2 class="verdict display" id="v-h">${esc(d.verdict)}</h2>
        <div class="tools"><button class="btn" id="copyBtn" type="button">${ico('copy')}${esc(t.copy)}</button></div>
      </div>
      <div class="ring" role="img" aria-label="${esc(t.conf)}: ${conf}/10">
        <div class="dial" aria-hidden="true"><svg viewBox="0 0 112 112" width="112" height="112">
          <circle cx="56" cy="56" r="48" fill="none" stroke="var(--line)" stroke-width="10"/>
          <circle class="arc" data-to="${C*conf/10}" cx="56" cy="56" r="48" fill="none" stroke="${tone[2]}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${C*conf/10} ${C}" transform="rotate(-90 56 56)"/></svg>
          <b><span>${conf}<small>/10</small></span></b></div>
        <div class="cap" aria-hidden="true">${esc(t.conf)}<br>${esc(t.confCap)}</div>
      </div>
    </section>

    <section class="card" id="todo" aria-labelledby="todo-h"><h2 id="todo-h">${esc(t.todo)}</h2>
      <div class="actions">
        <div class="a test"><h3 class="k">${ico('target')}${esc(t.test)}</h3>${esc(d.key_assumption)}</div>
        <div class="a next"><h3 class="k">${ico('clock')}${esc(t.next)}</h3>${esc(d.next_step)}</div>
        <div class="a kill"><h3 class="k">${ico('stop')}${esc(t.kill)}</h3>${esc(d.kill_criterion)}</div>
      </div></section>

    <div class="grid2">
      <section class="card note"><div class="ic" style="background:var(--go-soft);color:var(--go)">${ico('check')}</div><div><h3>${esc(t.agree)}</h3>${esc(d.agreement)}</div></section>
      <section class="card note"><div class="ic" style="background:var(--test-soft);color:var(--test)">${ico('zap')}</div><div><h3>${esc(t.dis)}</h3>${esc(d.disagreement)}</div></section>
    </div>

    ${(cx.prompt||facts.length)?`<section class="card" id="ctx" aria-labelledby="ctx-h"><h2 id="ctx-h">${esc(t.ctx)}</h2>
      ${cx.prompt?`<p class="ask clamp" id="ask">${esc(cx.prompt)}</p><button class="more" id="moreBtn" type="button" aria-expanded="false" aria-controls="ask" hidden>${esc(t.more)}</button>`:''}
      ${facts.length?`<h3 class="sr">${esc(t.facts)}</h3><ul class="facts">${facts.map(f=>`<li><span class="pill ${esc(f.kind)}">${esc(t.kinds[f.kind]||f.kind)}</span><span>${esc(f.text)}</span></li>`).join('')}</ul>`:''}
    </section>`:''}

    <section class="card" id="prec" aria-labelledby="prec-h"><h2 id="prec-h">${esc(t.prec)} <span class="count">${prec.length}</span></h2>
      ${prec.length?`<p class="hint">${esc(t.precHint)}</p><div class="prec">${prec.map(p=>{const s=p.type==='survivor', u=safeUrl(p.url); return `
        <article class="p ${s?'survivor':'failure'}">
          <span class="pill ${s?'surv':'fell'}">${ico(s?'check':'x')}${esc(s?t.surv:t.fell)}</span>
          <h3>${esc(p.name)}</h3><div class="yrs">${esc(p.years)}</div>
          <p>${esc(p.note)}</p>
          ${((p.match||[]).length||(p.miss||[]).length)?`<p class="sim">${esc(t.sim)}</p><div class="chips">${(p.match||[]).map(m=>`<span>${esc(m)}</span>`).join('')}${(p.miss||[]).map(m=>`<span class="miss"><span class="sr">(${esc(t.not)}) </span>${esc(m)}</span>`).join('')}</div>`:''}
          ${u?`<a class="src" href="${u}" target="_blank" rel="noopener">${esc(t.src)} ${ico('ext')}<span class="sr"> (${esc(p.name)})</span></a>`:''}
        </article>`}).join('')}</div>`:`<p class="hint" style="margin:0">${esc(t.none)}</p>`}
    </section>

    ${adv.length?`<section class="card" id="crew" aria-labelledby="crew-h"><h2 id="crew-h">${esc(t.crew)} <span class="count">${adv.length}</span></h2>
      <p class="hint">${esc(t.crewHint)}</p>
      <div class="tally" aria-hidden="true">${['for','depends','against'].filter(k=>cnt[k]).map(k=>`<i data-to="${cnt[k]/tot*100}%" style="width:${cnt[k]/tot*100}%;background:${posVar(k)}"></i>`).join('')}</div>
      <div class="legend">${['for','depends','against'].map(k=>`<span><b style="background:${posVar(k)}" aria-hidden="true"></b>${esc(t[k])}: ${cnt[k]}</span>`).join('')}</div>
      <div class="crew">${adv.map((a,i)=>{const c=CREW[a.key]; return `
        <article class="m hop" style="--d:${(-i*0.55).toFixed(2)}s;--mc-soft:${c.c[1]}1F;--mc-line:${c.c[1]}40;--mc-ink:${c.c[2]}">
          <div class="av">${mq(a.key,84)}<div class="nick" aria-hidden="true">${esc(c.nick)}</div></div>
          <div><div class="head"><h3 class="role"><span class="sr">${esc(c.nick)}, </span>${esc(t.roles[a.key]||a.name)}</h3><span class="pill ${esc(a.position)}">${esc(t[a.position]||a.position)}</span></div>
            <p class="persona">${esc(t.persona[a.key]||'')}</p>
            <p class="bubble">${esc(a.line)}${a.opinion?`<span class="op">${esc(t.op)}</span>`:''}</p></div>
        </article>`}).join('')}</div>
    </section>`:''}

    ${pm.length?`<section class="card" id="pm" aria-labelledby="pm-h"><h2 id="pm-h">${esc(t.pm)}</h2><p class="hint">${esc(t.pmHint)}</p>
      <ol class="pm">${pm.map((x,i)=>`<li><span class="n" aria-hidden="true">${i+1}</span><div>${esc(x.cause)}${x.signal?`<br><span class="sig"><b>${esc(t.signal)}:</b> ${esc(x.signal)}</span>`:''}</div></li>`).join('')}</ol></section>`:''}

    ${srcs.length?`<section class="card" id="src" aria-labelledby="src-h"><h2 id="src-h">${esc(t.srcs)}</h2><ol class="srcs">${srcs.map(s=>{const u=safeUrl(s.url); return `<li>${u?`<a href="${u}" target="_blank" rel="noopener">${esc(s.title||s.url)}</a>`:esc(s.title)}</li>`}).join('')}</ol></section>`:''}

    <section class="card"><details class="how"><summary>${esc(t.how)}</summary><div class="how-body">
      ${t.howText.map(x=>`<p>${esc(x)}</p>`).join('')}
      <div class="crewkey">${Object.keys(CREW).map(k=>`<div>${mq(k,40)}<span><b>${esc(CREW[k].nick)}</b> · ${esc(t.roles[k])}</span></div>`).join('')}</div>
    </div></details></section>

    <footer><span>${esc(t.foot)}</span><span>${esc(t.made)} <a href="https://github.com/koaling/been-there">Been There</a> · <a href="https://koaling.github.io/been-there/">${esc(t.what)}</a></span></footer>`;

  /* "Show more" only when the question is actually clamped */
  const ask = document.getElementById('ask'), more = document.getElementById('moreBtn');
  if (ask && more) {
    requestAnimationFrame(() => { if (ask.scrollHeight > ask.clientHeight + 2) more.hidden = false; });
    more.addEventListener('click', () => { const open = !ask.classList.toggle('clamp'); more.setAttribute('aria-expanded', String(open)); more.textContent = open ? t.less : t.more; });
  }

  /* Copy a plain-text summary for chat or email */
  const toast = msg => { const el = document.getElementById('toast'); el.textContent = msg; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 2200); };
  document.getElementById('copyBtn').addEventListener('click', async () => {
    const lines = [d.title, `${t.tone[tk]}: ${d.verdict} (${t.conf.toLowerCase()} ${conf}/10)`, '', `${t.test}: ${d.key_assumption}`, `${t.next}: ${d.next_step}`, `${t.kill}: ${d.kill_criterion}`];
    if (prec.length) lines.push('', `${t.prec}: ` + prec.map(p => `${p.type==='survivor'?'✓':'✕'} ${p.name}`).join(', '));
    lines.push('', `${t.made} Been There · https://koaling.github.io/been-there/`);
    try { await navigator.clipboard.writeText(lines.join('\n')); toast(t.copied); } catch (e) { toast(t.copyFail); }
  });

  /* Reveal on scroll; ring and tally fill when seen */
  const app = document.getElementById('app');
  app.querySelectorAll(':scope > section, :scope > .grid2 > section, .p, .m').forEach(el => el.classList.add('reveal'));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window) {
    document.documentElement.classList.add('js');
    app.querySelectorAll('.ring .arc').forEach(a => a.setAttribute('stroke-dasharray', '0 ' + C));
    app.querySelectorAll('.tally i').forEach(b => b.style.width = '0');
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (!e.isIntersecting) return; const el = e.target; el.classList.add('in'); io.unobserve(el);
      el.querySelectorAll('.arc').forEach(a => requestAnimationFrame(() => a.setAttribute('stroke-dasharray', a.dataset.to + ' ' + C)));
      el.querySelectorAll('.tally i').forEach(b => requestAnimationFrame(() => b.style.width = b.dataset.to));
    }), {threshold:.1});
    let n = 0; app.querySelectorAll('.reveal').forEach(el => { if (el.matches('.p,.m')) el.style.transitionDelay = ((n++ % 4) * 70) + 'ms'; else n = 0; io.observe(el); });
    window.addEventListener('beforeprint', () => app.querySelectorAll('.reveal').forEach(el => el.classList.add('in')));
  }
}
</script>
</body>
</html>
